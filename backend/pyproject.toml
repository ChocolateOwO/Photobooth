[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "photobooth"
version = "0.1.0"
description = "Local-first event photobooth backend"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14",
    "pillow>=11",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.18",
    "segno>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
]

[project.scripts]
photobooth = "photobooth.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
photobooth = ["templates_data/*.json", "frames_data/builtin/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests", "../scripts/tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
pythonpath = [".", "../scripts/tests"]
markers = [
    "slow: slower integration tests (still run by verify)",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "../scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S104", "S105", "S106", "S108", "S311", "RUF001"]  # RUF001: "2×6" labels
"../scripts/tests/**" = ["S105", "S106", "S108"]

[tool.ruff.lint.isort]
known-first-party = ["photobooth", "helpers"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["photobooth"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "photobooth"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Top-level layering: entrypoints > composition root > modules > core"
type = "layers"
layers = [
    "photobooth.cli",
    "photobooth.main",
    "photobooth.container",
    "photobooth.modules",
    "photobooth.core",
]

[[tool.importlinter.contracts]]
name = "Module layering: api > service > domain"
type = "layers"
containers = [
    "photobooth.modules.system",
    "photobooth.modules.kiosk",
    "photobooth.modules.templates",
    "photobooth.modules.rendering",
    "photobooth.modules.assets",
    "photobooth.modules.auth",
    "photobooth.modules.event_profiles",
    "photobooth.modules.frames",
    "photobooth.modules.themes",
    "photobooth.modules.booth",
    "photobooth.modules.delivery",
]
layers = ["api", "service", "domain"]
exhaustive = false

[[tool.importlinter.contracts]]
name = "API and service layers never import infrastructure (only the composition root wires it)"
type = "forbidden"
source_modules = [
    "photobooth.modules.system.api",
    "photobooth.modules.system.service",
    "photobooth.modules.kiosk.api",
    "photobooth.modules.kiosk.service",
    "photobooth.modules.templates.api",
    "photobooth.modules.templates.service",
    "photobooth.modules.assets.api",
    "photobooth.modules.assets.service",
    "photobooth.modules.auth.api",
    "photobooth.modules.auth.service",
    "photobooth.modules.event_profiles.api",
    "photobooth.modules.event_profiles.service",
    "photobooth.modules.frames.api",
    "photobooth.modules.frames.service",
    "photobooth.modules.themes.api",
    "photobooth.modules.themes.service",
    "photobooth.modules.booth.api",
    "photobooth.modules.booth.service",
    "photobooth.modules.rendering.service",
    "photobooth.modules.delivery.api",
    "photobooth.modules.delivery.service",
]
forbidden_modules = [
    "photobooth.modules.system.repository",
    "photobooth.modules.kiosk.repository",
    "photobooth.modules.templates.repository",
    "photobooth.modules.templates.imaging",
    "photobooth.modules.rendering.renderer",
    "photobooth.modules.rendering.queue",
    "photobooth.modules.storage.local",
    "photobooth.modules.assets.repository",
    "photobooth.modules.assets.inspector",
    "photobooth.modules.auth.repository",
    "photobooth.modules.auth.hasher",
    "photobooth.modules.auth.sessions",
    "photobooth.modules.event_profiles.repository",
    "photobooth.modules.frames.repository",
    "photobooth.modules.frames.validator",
    "photobooth.modules.themes.extractor",
    "photobooth.modules.delivery.repository",
    "photobooth.modules.delivery.qr",
    "segno",
    "PIL",
    "argon2",
    "sqlalchemy",
]

[[tool.importlinter.contracts]]
name = "Domain layer has no framework or infrastructure dependency"
type = "forbidden"
source_modules = [
    "photobooth.modules.system.domain",
    "photobooth.modules.kiosk.domain",
    "photobooth.modules.templates.domain",
    "photobooth.modules.rendering.domain",
    "photobooth.modules.storage.domain",
    "photobooth.modules.assets.domain",
    "photobooth.modules.auth.domain",
    "photobooth.modules.event_profiles.domain",
    "photobooth.modules.frames.domain",
    "photobooth.modules.themes.domain",
    "photobooth.modules.booth.domain",
    "photobooth.modules.delivery.domain",
]
forbidden_modules = [
    "fastapi",
    "starlette",
    "sqlalchemy",
    "uvicorn",
    "PIL",
    "argon2",
    "photobooth.core.db",
    "photobooth.core.config",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Feature modules are independent of each other"
type = "independence"
modules = [
    "photobooth.modules.system",
    "photobooth.modules.kiosk",
    "photobooth.modules.templates",
    "photobooth.modules.auth",
    "photobooth.modules.event_profiles",
    "photobooth.modules.storage",
]

[[tool.importlinter.contracts]]
name = "Rendering depends only on the templates domain; templates never depend on rendering"
type = "forbidden"
source_modules = ["photobooth.modules.rendering"]
forbidden_modules = [
    "photobooth.modules.templates.api",
    "photobooth.modules.templates.service",
    "photobooth.modules.templates.repository",
    "photobooth.modules.templates.imaging",
    "photobooth.modules.system",
    "photobooth.modules.kiosk",
    "photobooth.modules.auth",
    "photobooth.modules.event_profiles",
    "photobooth.modules.assets",
    "photobooth.modules.storage",
    "photobooth.modules.frames",
]

[[tool.importlinter.contracts]]
name = "Frames never import auth, kiosk, system or the event_profiles internals"
type = "forbidden"
source_modules = ["photobooth.modules.frames"]
forbidden_modules = [
    "photobooth.modules.auth",
    "photobooth.modules.kiosk",
    "photobooth.modules.system",
    "photobooth.modules.event_profiles",
    "photobooth.modules.storage.local",
]

[[tool.importlinter.contracts]]
name = "Templates never import rendering"
type = "forbidden"
source_modules = ["photobooth.modules.templates"]
forbidden_modules = ["photobooth.modules.rendering"]

[[tool.importlinter.contracts]]
name = "Assets depend only on the storage domain"
type = "forbidden"
source_modules = ["photobooth.modules.assets"]
forbidden_modules = [
    "photobooth.modules.storage.local",
    "photobooth.modules.system",
    "photobooth.modules.kiosk",
    "photobooth.modules.templates",
    "photobooth.modules.rendering",
    "photobooth.modules.auth",
    "photobooth.modules.event_profiles",
]

[[tool.importlinter.contracts]]
name = "Themes never import other feature modules"
type = "forbidden"
source_modules = ["photobooth.modules.themes"]
forbidden_modules = [
    "photobooth.modules.system",
    "photobooth.modules.kiosk",
    "photobooth.modules.templates",
    "photobooth.modules.rendering",
    "photobooth.modules.assets",
    "photobooth.modules.auth",
    "photobooth.modules.event_profiles",
    "photobooth.modules.frames",
    "photobooth.modules.storage",
]

[[tool.importlinter.contracts]]
name = "Event profiles use only the themes domain (tokens, validation, defaults)"
type = "forbidden"
source_modules = ["photobooth.modules.event_profiles"]
forbidden_modules = [
    "photobooth.modules.themes.api",
    "photobooth.modules.themes.service",
    "photobooth.modules.themes.extractor",
    "photobooth.modules.themes.schemas",
]

[[tool.importlinter.contracts]]
name = "Booth sessions talk to other modules only through ports"
type = "forbidden"
source_modules = ["photobooth.modules.sessions"]
forbidden_modules = [
    "photobooth.modules.assets",
    "photobooth.modules.auth",
    "photobooth.modules.booth",
    "photobooth.modules.delivery",
    "photobooth.modules.eligibility",
    "photobooth.modules.event_profiles",
    "photobooth.modules.frames",
    "photobooth.modules.kiosk",
    "photobooth.modules.rendering",
    "photobooth.modules.storage",
    "photobooth.modules.system",
    "photobooth.modules.templates",
    "photobooth.modules.themes",
]

[[tool.importlinter.contracts]]
name = "The eligibility check knows nothing about the rest of the app"
type = "forbidden"
source_modules = ["photobooth.modules.eligibility"]
forbidden_modules = ["photobooth.core", "photobooth.modules"]
[[tool.importlinter.contracts]]
name = "The participant booth module talks to other modules only through ports"
type = "forbidden"
source_modules = ["photobooth.modules.booth"]
forbidden_modules = [
    "photobooth.modules.system",
    "photobooth.modules.kiosk",
    "photobooth.modules.templates",
    "photobooth.modules.rendering",
    "photobooth.modules.assets",
    "photobooth.modules.auth",
    "photobooth.modules.event_profiles",
    "photobooth.modules.frames",
    "photobooth.modules.storage",
    "photobooth.modules.themes",
]

[[tool.importlinter.contracts]]
name = "Delivery talks to other modules only through ports"
type = "forbidden"
source_modules = ["photobooth.modules.delivery"]
forbidden_modules = [
    "photobooth.modules.sessions",
    "photobooth.modules.booth",
    "photobooth.modules.rendering",
    "photobooth.modules.frames",
    "photobooth.modules.assets",
    "photobooth.modules.storage",
    "photobooth.modules.event_profiles",
    "photobooth.modules.auth",
    "photobooth.modules.kiosk",
    "photobooth.modules.system",
    "photobooth.modules.templates",
    "photobooth.modules.themes",
]
