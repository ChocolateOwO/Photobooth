[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "photobooth"
version = "0.1.0"
description = "Local-first event photobooth backend"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
]

[project.scripts]
photobooth = "photobooth.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "../scripts/tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
pythonpath = [".", "../scripts/tests"]
markers = [
    "slow: slower integration tests (still run by verify)",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "../scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S104", "S105", "S106", "S108", "S311"]
"../scripts/tests/**" = ["S105", "S106", "S108"]

[tool.ruff.lint.isort]
known-first-party = ["photobooth", "helpers"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["photobooth"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "photobooth"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Top-level layering: entrypoints > composition root > modules > core"
type = "layers"
layers = [
    "photobooth.cli",
    "photobooth.main",
    "photobooth.container",
    "photobooth.modules",
    "photobooth.core",
]

[[tool.importlinter.contracts]]
name = "Module layering: api > service > domain"
type = "layers"
containers = ["photobooth.modules.system", "photobooth.modules.kiosk"]
layers = ["api", "service", "domain"]
exhaustive = false

[[tool.importlinter.contracts]]
name = "API and service layers never import repositories (only the composition root wires them)"
type = "forbidden"
source_modules = [
    "photobooth.modules.system.api",
    "photobooth.modules.system.service",
    "photobooth.modules.kiosk.api",
    "photobooth.modules.kiosk.service",
]
forbidden_modules = [
    "photobooth.modules.system.repository",
    "photobooth.modules.kiosk.repository",
]

[[tool.importlinter.contracts]]
name = "Domain layer has no framework or infrastructure dependency"
type = "forbidden"
source_modules = [
    "photobooth.modules.system.domain",
    "photobooth.modules.kiosk.domain",
]
forbidden_modules = [
    "fastapi",
    "starlette",
    "sqlalchemy",
    "uvicorn",
    "photobooth.core.db",
    "photobooth.core.config",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Modules are independent of each other"
type = "independence"
modules = ["photobooth.modules.system", "photobooth.modules.kiosk"]
